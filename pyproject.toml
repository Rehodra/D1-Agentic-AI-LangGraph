[project]
name = "langgraph-project"
version = "0.1.0"
description = "LangGraph and LangChain project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph",
    "langchain",
    "langchain-groq",
    "python-dotenv",

    # RAG
    "langchain-community",
    "langchain-text-splitters",
    "langchain-huggingface",

    # Embeddings
    "sentence-transformers",

    # Vector database
    "faiss-cpu",

    # PDF document loading
    "pypdf",
]